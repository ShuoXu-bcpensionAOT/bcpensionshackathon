<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 760" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 Z" fill="#55606E"/></marker>
    <marker id="ahd" markerWidth="12" markerHeight="12" refX="8.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 Z" fill="#98A2B0"/></marker>
  </defs>
  <style>
    .zt{font-size:15px;font-weight:600;} .zs{font-size:11px;fill:#6A7480;}
    .tile{fill:#FFFFFF;stroke:#D3DAE3;stroke-width:1.3;}
    .tt{font-size:13px;font-weight:600;fill:#1E2732;} .ts{font-size:11px;fill:#6A7480;}
    .flow{stroke:#55606E;stroke-width:2;fill:none;} .ctrl{stroke:#98A2B0;stroke-width:1.6;fill:none;stroke-dasharray:5 4;}
    .al{font-size:10.5px;fill:#55606E;font-weight:600;} .cl{font-size:10.5px;fill:#8A93A0;font-weight:600;} .bn{font-size:11px;font-weight:700;fill:#fff;}
    .warn{font-size:10.5px;fill:#B4531A;font-weight:600;}
  </style>
  <rect x="0" y="0" width="1520" height="760" fill="#F4F6F9"/>
  <text x="40" y="52" font-size="22" font-weight="700" fill="#1E2732">Private OCI Oracle → Microsoft Fabric — Mirroring (CDC)</text>
  <text x="40" y="76" font-size="13" fill="#6A7480">Near-real-time replica via LogMiner CDC · requires a dedicated on-premises data gateway (24/7) · raw data lands in OneLake</text>

  <!-- zones -->
  <rect x="40" y="110" width="252" height="560" rx="14" fill="#FBEDEB" stroke="#C74634" stroke-width="1.4"/>
  <text class="zt" x="56" y="140" fill="#A5342A">Oracle Cloud (OCI)</text>
  <text class="zs" x="56" y="159">Private VCN · CDC source</text>
  <rect x="472" y="110" width="252" height="560" rx="14" fill="#E9F1FB" stroke="#0F6CBD" stroke-width="1.4"/>
  <text class="zt" x="488" y="140" fill="#0F5AA8">Azure Virtual Network</text>
  <text class="zs" x="488" y="159">Delegated subnet · Microsoft backbone</text>
  <rect x="746" y="110" width="556" height="560" rx="14" fill="#E6F4EF" stroke="#0E7C5F" stroke-width="1.4"/>
  <text class="zt" x="762" y="140" fill="#0B6B52">Microsoft Fabric — Capacity</text>
  <text class="zs" x="762" y="159">Mirrored database · OneLake · Direct Lake</text>
  <rect x="1324" y="110" width="156" height="560" rx="14" fill="#FBF3D8" stroke="#B8860B" stroke-width="1.4"/>
  <text class="zt" x="1340" y="140" fill="#8C6708">Consumption</text>

  <!-- private link labels -->
  <text class="al" x="382" y="256" text-anchor="middle">Azure–OCI Interconnect</text>
  <text class="al" x="382" y="272" text-anchor="middle">/ ExpressRoute</text>
  <text class="warn" x="382" y="300" text-anchor="middle">CDC · LogMiner redo</text>
  <text class="cl" x="382" y="360" text-anchor="middle">continuous · near-real-time</text>

  <!-- arrows -->
  <path class="flow" d="M250,316 H492" marker-end="url(#ah)"/>
  <path class="flow" d="M692,300 C724,296 730,294 760,294" marker-end="url(#ah)"/>
  <path class="flow" d="M860,332 V392" marker-end="url(#ah)"/>
  <path class="flow" d="M934,448 H974" marker-end="url(#ah)"/>
  <path class="flow" d="M1096,448 H1136" marker-end="url(#ah)"/>
  <path class="flow" d="M1258,436 C1290,420 1300,372 1328,356" marker-end="url(#ah)"/>
  <path class="ctrl" d="M1058,600 H964" marker-end="url(#ahd)"/>
  <path class="ctrl" d="M900,558 C960,528 990,520 1016,502" marker-end="url(#ahd)"/>
  <text class="al" x="712" y="286">managed</text>
  <text class="al" x="872" y="368">replicate</text>
  <text class="al" x="1272" y="392">Direct Lake</text>
  <text class="cl" x="978" y="592">metadata</text>
  <text class="cl" x="936" y="520">build</text>

  <!-- badges -->
  <g>
    <g transform="translate(360,316)"><circle r="11" fill="#C74634"/><text class="bn" text-anchor="middle" y="4">1</text></g>
    <g transform="translate(726,296)"><circle r="11" fill="#2B3440"/><text class="bn" text-anchor="middle" y="4">2</text></g>
    <g transform="translate(860,364)"><circle r="11" fill="#2B3440"/><text class="bn" text-anchor="middle" y="4">3</text></g>
    <g transform="translate(954,448)"><circle r="11" fill="#2B3440"/><text class="bn" text-anchor="middle" y="4">4</text></g>
    <g transform="translate(1116,448)"><circle r="11" fill="#2B3440"/><text class="bn" text-anchor="middle" y="4">5</text></g>
    <g transform="translate(1296,392)"><circle r="11" fill="#B8860B"/><text class="bn" text-anchor="middle" y="4">6</text></g>
  </g>

  <!-- OCI tiles -->
  <rect x="58" y="256" width="216" height="180" rx="10" fill="none" stroke="#C74634" stroke-width="1.1" stroke-dasharray="5 4"/>
  <text x="70" y="248" font-size="11" font-weight="600" fill="#A5342A">Private subnet</text>
  <rect class="tile" x="76" y="270" width="180" height="72" rx="10"/>
  <g transform="translate(90,290)"><g stroke="#C74634" stroke-width="1.6" fill="#FBEDEB"><ellipse cx="12" cy="5" rx="9" ry="3.2"/><path d="M3,5 V19 C3,20.8 7,22 12,22 C17,22 21,20.8 21,19 V5" fill="none"/><path d="M3,12 C3,13.8 7,15 12,15 C17,15 21,13.8 21,12" fill="none"/></g></g>
  <text class="tt" x="128" y="302">Oracle Database</text>
  <text class="ts" x="128" y="320">private IP · system of record</text>
  <rect class="tile" x="76" y="356" width="180" height="60" rx="10"/>
  <g transform="translate(90,372)"><g fill="none" stroke="#C74634" stroke-width="1.5"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="7.5" y1="7" x2="16.5" y2="7"/><line x1="7.5" y1="11" x2="16.5" y2="11"/><line x1="7.5" y1="15" x2="13" y2="15"/></g></g>
  <text class="tt" x="128" y="382">Redo / archive logs</text>
  <text class="ts" x="128" y="399">read by LogMiner</text>

  <!-- DBA prereq callout -->
  <rect x="58" y="470" width="216" height="180" rx="10" fill="#FBEEDD" stroke="#D98A2B" stroke-width="1.2"/>
  <g transform="translate(70,486)"><path d="M11,2 L21,20 H1 Z" fill="none" stroke="#B4531A" stroke-width="1.6"/><line x1="11" y1="9" x2="11" y2="14" stroke="#B4531A" stroke-width="1.6"/><circle cx="11" cy="17" r="1.1" fill="#B4531A"/></g>
  <text x="100" y="502" font-size="12" font-weight="700" fill="#B4531A">DBA prerequisites</text>
  <text x="74" y="526" font-size="11" fill="#7A4A1A">• ARCHIVELOG mode</text>
  <text x="74" y="546" font-size="11" fill="#7A4A1A">• LogMiner enabled</text>
  <text x="74" y="566" font-size="11" fill="#7A4A1A">• supplemental logging</text>
  <text x="74" y="582" font-size="11" fill="#7A4A1A">  (database + per-table)</text>
  <text x="74" y="602" font-size="11" fill="#7A4A1A">• CDC grants (LOGMINING…)</text>
  <text x="74" y="624" font-size="10.5" fill="#9A6A34">Invasive change on a production</text>
  <text x="74" y="638" font-size="10.5" fill="#9A6A34">system of record.</text>

  <!-- Azure tiles -->
  <rect class="tile" x="496" y="272" width="196" height="104" rx="10" stroke="#C0392B" stroke-width="1.8"/>
  <g transform="translate(512,312)"><g fill="#FBEDEB" stroke="#C0392B" stroke-width="1.5"><path d="M12,2 L21,5.5 V11 C21,17 12,22 12,22 C12,22 3,17 3,11 V5.5 Z"/><path d="M12,7 V16 M9,10 L12,7 L15,10 M9,13 L12,16 L15,13" fill="none" stroke="#C0392B" stroke-width="1.4"/></g></g>
  <text class="tt" x="550" y="304" fill="#A2291D">On-prem data gateway</text>
  <text class="warn" x="550" y="322">DEDICATED · NEW</text>
  <text class="ts" x="550" y="340">runs 24/7 for CDC</text>
  <text class="ts" x="550" y="356">install · patch · HA cluster</text>

  <rect x="496" y="404" width="196" height="82" rx="10" fill="#F1F3F6" stroke="#B6BEC9" stroke-width="1.3" stroke-dasharray="5 4"/>
  <g transform="translate(512,436)" opacity="0.75"><g fill="#E5E9EF" stroke="#9AA3B0" stroke-width="1.4"><path d="M12,2 L21,5.5 V11 C21,17 12,22 12,22 C12,22 3,17 3,11 V5.5 Z"/></g></g>
  <text x="550" y="432" font-size="13" font-weight="600" fill="#7C8695">Existing VNet gateway</text>
  <text x="550" y="450" font-size="11" fill="#96A0AD">PBI only — cannot serve</text>
  <text x="550" y="464" font-size="11" fill="#96A0AD">Fabric Mirroring</text>
  <g transform="translate(668,414)"><circle r="9" fill="#C0392B"/><path d="M-3.5,-3.5 L3.5,3.5 M3.5,-3.5 L-3.5,3.5" stroke="#fff" stroke-width="1.8"/></g>

  <!-- Fabric tiles -->
  <rect class="tile" x="760" y="250" width="200" height="82" rx="10"/>
  <g transform="translate(776,281)"><g stroke="#0E7C5F" stroke-width="1.5" fill="none"><path d="M4,7 h9 v-2.5 l4,4 l-4,4 v-2.5 h-9 Z" fill="#E6F4EF"/><path d="M20,17 h-9 v2.5 l-4,-4 l4,-4 v2.5 h9 Z" fill="#E6F4EF"/></g></g>
  <text class="tt" x="812" y="284">Fabric Mirroring</text>
  <text class="ts" x="812" y="302">managed CDC · Preview</text>

  <rect x="760" y="362" width="512" height="150" rx="10" fill="#FFFFFF" stroke="#BFD8CE" stroke-width="1.3"/>
  <text x="772" y="382" font-size="11" font-weight="600" fill="#0B6B52">OneLake</text>

  <rect class="tile" x="776" y="392" width="156" height="106" rx="10" stroke="#C0392B" stroke-width="1.7"/>
  <g transform="translate(790,430)"><g fill="#F3E2D2" stroke="#B87333" stroke-width="1.3"><path d="M4,8 L12,5 L20,8 L12,11 Z"/><path d="M4,12 L12,9 L20,12 L12,15 Z"/><path d="M4,16 L12,13 L20,16 L12,19 Z"/></g></g>
  <text class="tt" x="826" y="424" fill="#A2291D">Mirrored DB</text>
  <text class="ts" x="826" y="441">raw 1:1 replica (bronze)</text>
  <text class="warn" x="826" y="457">all cols incl. PII</text>
  <text class="warn" x="826" y="471">land raw</text>

  <rect class="tile" x="938" y="392" width="156" height="106" rx="10" stroke="#8A94A3"/>
  <g transform="translate(952,432)"><g fill="#E7EAEF" stroke="#8A94A3" stroke-width="1.3"><path d="M4,8 L12,5 L20,8 L12,11 Z"/><path d="M4,12 L12,9 L20,12 L12,15 Z"/><path d="M4,16 L12,13 L20,16 L12,19 Z"/></g></g>
  <text class="tt" x="988" y="428" fill="#5A6472">Silver</text>
  <text class="ts" x="988" y="446">dedup · DQ · mask</text>
  <text class="ts" x="988" y="460">you still build</text>

  <rect class="tile" x="1100" y="392" width="156" height="106" rx="10" stroke="#C99A2E"/>
  <g transform="translate(1114,432)"><g fill="#F5E9C8" stroke="#C99A2E" stroke-width="1.3"><path d="M4,8 L12,5 L20,8 L12,11 Z"/><path d="M4,12 L12,9 L20,12 L12,15 Z"/><path d="M4,16 L12,13 L20,16 L12,19 Z"/></g></g>
  <text class="tt" x="1150" y="428" fill="#8C6708">Gold</text>
  <text class="ts" x="1150" y="446">SCD1/2 · star</text>
  <text class="ts" x="1150" y="460">you still build</text>

  <rect class="tile" x="760" y="556" width="200" height="82" rx="10"/>
  <g transform="translate(776,587)"><g fill="none" stroke="#0E7C5F" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8.5" y1="3" x2="8.5" y2="21"/><path d="M13,8 l1.1,2.5 L16.6,11.6 l-2.5,1.2 L13,15.3 l-1.1,-2.5 L9.4,11.6 l2.5,-1.2 Z" fill="#0E7C5F" stroke="none"/></g></g>
  <text class="tt" x="812" y="588">Spark notebooks</text>
  <text class="ts" x="812" y="606">silver / gold only</text>

  <rect class="tile" x="1056" y="556" width="200" height="82" rx="10"/>
  <g transform="translate(1072,587)"><g stroke="#0E7C5F" stroke-width="1.6" fill="#E6F4EF"><ellipse cx="12" cy="5" rx="8.5" ry="3" stroke="#5A6472"/><path d="M3.5,5 V19 C3.5,20.6 7.5,21.6 12,21.6 C16.5,21.6 20.5,20.6 20.5,19 V5" fill="none" stroke="#5A6472"/><path d="M3.5,12 C3.5,13.6 7.5,14.6 12,14.6 C16.5,14.6 20.5,13.6 20.5,12" fill="none" stroke="#5A6472"/></g></g>
  <text class="tt" x="1108" y="588">Fabric SQL — config_db</text>
  <text class="ts" x="1108" y="606">silver / gold rules</text>

  <!-- Consumption -->
  <rect class="tile" x="1330" y="300" width="144" height="96" rx="10" stroke="#B8860B"/>
  <g transform="translate(1344,336)"><g fill="#C99A2E"><rect x="3" y="12" width="4.4" height="8" rx="1"/><rect x="9.8" y="7" width="4.4" height="13" rx="1"/><rect x="16.6" y="3" width="4.4" height="17" rx="1"/></g></g>
  <text class="tt" x="1382" y="340">Power BI</text>
  <text class="ts" x="1382" y="358">Direct Lake</text>
  <text class="ts" x="1382" y="372">on Gold</text>
  <rect class="tile" x="1330" y="440" width="144" height="80" rx="10"/>
  <g transform="translate(1346,472)"><g fill="#6A7480"><circle cx="12" cy="8" r="4"/><path d="M4,21 C4,15 20,15 20,21 Z"/></g></g>
  <text class="tt" x="1384" y="476">Business users</text>
  <text class="ts" x="1384" y="494">reports</text>

  <!-- legend -->
  <g transform="translate(300,700)">
    <line x1="0" y1="8" x2="34" y2="8" class="flow" marker-end="url(#ah)"/><text x="42" y="12" font-size="11.5" fill="#55606E">Continuous CDC flow (1–6)</text>
    <line x1="255" y1="8" x2="289" y2="8" class="ctrl" marker-end="url(#ahd)"/><text x="297" y="12" font-size="11.5" fill="#55606E">You still build silver / gold</text>
    <g transform="translate(500,0)"><path d="M10,1 L19,16 H1 Z" fill="none" stroke="#B4531A" stroke-width="1.5"/><text x="26" y="12" font-size="11.5" fill="#B4531A">Raw incl. PII lands in OneLake · governance downstream</text></g>
