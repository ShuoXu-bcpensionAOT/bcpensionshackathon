<text x="70" y="430" font-size="12" font-weight="700" fill="#0F5AA8" text-anchor="start">Best for:</text>
<text x="78" y="450" font-size="11" font-weight="400" fill="#33404f" text-anchor="start">• Azure / cloud PaaS sources via private endpoints (no public internet)</text>
<text x="78" y="469" font-size="11" font-weight="400" fill="#33404f" text-anchor="start">• Fabric pipelines · Copy Job · Dataflow Gen2 · Power BI</text>
<text x="78" y="488" font-size="11" font-weight="400" fill="#33404f" text-anchor="start">• Fabric Mirroring of VNet-reachable sources (e.g. Azure SQL via PE)</text>
<text x="78" y="507" font-size="11" font-weight="400" fill="#33404f" text-anchor="start">• Reuse for many sources; lowest ops (no VM to patch)</text>
<rect x="600" y="80" width="540" height="470" rx="16" fill="#FBEDEB" stroke="#C0392B" stroke-width="1.5"/>
<text x="870" y="108" font-size="15" font-weight="700" fill="#A2291D" text-anchor="middle">On-premises data gateway — self-hosted</text>
<text x="870" y="127" font-size="11" font-weight="400" fill="#8a4a3f" text-anchor="middle">you install / patch / HA-cluster on a VM · outbound-only</text>
<rect x="630" y="150" width="480" height="250" rx="12" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="6 4"/>
