<text x="590.0" y="34" font-size="19" font-weight="750" fill="#1f2733" text-anchor="middle">VNet data gateway vs On-premises data gateway — when to use which</text>
<text x="590.0" y="55" font-size="12" font-weight="400" fill="#63707E" text-anchor="middle">Official Azure architecture icons. A gateway bridges Fabric to sources it can't reach directly.</text>
