<text x="630" y="430" font-size="12" font-weight="700" fill="#A2291D" text-anchor="start">Required for:</text>
<text x="638" y="450" font-size="11" font-weight="400" fill="#33404f" text-anchor="start">• On-premises &amp; private sources with no VNet path</text>
<text x="638" y="469" font-size="11" font-weight="400" fill="#33404f" text-anchor="start">• Oracle Mirroring (OPDG only — VNet gateway not supported)</text>
<text x="638" y="488" font-size="11" font-weight="400" fill="#33404f" text-anchor="start">• Sources needing a locally-installed client / driver (Oracle client)</text>
<text x="638" y="507" font-size="11" font-weight="400" fill="#33404f" text-anchor="start">• Fabric Mirroring / pipelines / Power BI for on-prem data</text>
